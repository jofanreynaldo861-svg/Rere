<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lego Adventure</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Inter, system-ui, sans-serif; background:#0f172a; color:#f8fafc; overflow-x:hidden; }
  /* Salto dengan lintasan melengkung, rotasi 3D, dan squash/stretch */
  #stage { perspective: 850px; perspective-origin: 50% 55%; }
  #legoContainer { transform-style: preserve-3d; transform-origin: 50% 75%; }
  #legoImg { backface-visibility: visible; transform-origin: 50% 75%; }
  @keyframes realisticFlip {
    0%   { transform: translate3d(0, 0, 0) rotateX(0deg) rotateZ(0deg) scale(1, 1); }
    10%  { transform: translate3d(0, 9px, 0) rotateX(-8deg) rotateZ(-3deg) scale(1.08, .9); }
    27%  { transform: translate3d(0, -68px, 0) rotateX(95deg) rotateZ(-7deg) scale(.98, 1.04); }
    45%  { transform: translate3d(0, -118px, 0) rotateX(190deg) rotateZ(2deg) scale(.94, 1.02); }
    63%  { transform: translate3d(0, -78px, 0) rotateX(275deg) rotateZ(7deg) scale(1.02, .98); }
    78%  { transform: translate3d(0, -20px, 0) rotateX(335deg) rotateZ(3deg) scale(1.04, .94); }
    88%  { transform: translate3d(0, 5px, 0) rotateX(355deg) rotateZ(-2deg) scale(.9, 1.1); }
    100% { transform: translate3d(0, 0, 0) rotateX(360deg) rotateZ(0deg) scale(1, 1); }
  }
  .animate-flip { animation:realisticFlip 1.45s cubic-bezier(.22,.72,.28,1) both; }
  @keyframes eat {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.1) translateY(-10px); }
  }
  .animate-eat { animation:eat .6s ease-in-out infinite; }
  @keyframes shake {
    0% { transform:translate(2px,2px) rotate(0deg); }
    20% { transform:translate(-4px,1px) rotate(-3deg); }
    40% { transform:translate(1px,-3px) rotate(3deg); }
    60% { transform:translate(-3px,2px) rotate(0deg); }
    80% { transform:translate(3px,-2px) rotate(2deg); }
    100% { transform:translate(1px,-2px) rotate(-1deg); }
  }
  .jumpscare-shake { animation:shake .08s infinite; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  #legoImg { user-select:none; -webkit-user-drag:none; }
  #jumpscareOverlay { position:fixed; }
  #jumpscareImg { width:100vw; height:100dvh; object-fit:contain; background:#000; }
</style>
</head>

  <p class="text-slate-400 text-sm mt-2">Karakter LEGO salto, makan es krim vanila, lalu kejutan di akhir.</p>
</header>

<footer class="w-full max-w-xl mt-6 flex flex-wrap gap-3 justify-center">
  <button onclick="playFlip()" id="btnFlip" class="flex-1 min-w-[105px] bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition transform active:scale-95 text-sm">🤸‍♀️ Salto</button>
  <button onclick="playEat()" id="btnEat" class="flex-1 min-w-[105px] bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition transform active:scale-95 text-sm">🍦 Es Krim</button>
  <button onclick="playFullSequence()" id="btnSeq" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition transform active:scale-95 text-sm">▶️ Putar Otomatis (Salto, Es Krim & Kejutan)</button>
</footer>

<div id="msgBox" class="fixed bottom-6 right-6 bg-slate-800 border border-slate-600 text-slate-200 px-5 py-3 rounded-xl shadow-2xl hidden z-[110] text-sm">
  <span id="msgText">Pesan pemberitahuan</span>
</div>

<script>
let isPlaying = false;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
  try {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'flip') {
      osc.type='sine'; osc.frequency.setValueAtTime(300,now); osc.frequency.exponentialRampToValueAtTime(800,now+.6);
      gain.gain.setValueAtTime(.3,now); gain.gain.linearRampToValueAtTime(.01,now+.6); osc.start(now); osc.stop(now+.6);
    } else if (type === 'eat') {
      osc.type='triangle'; osc.frequency.setValueAtTime(450,now); osc.frequency.setValueAtTime(650,now+.15);
      gain.gain.setValueAtTime(.2,now); gain.gain.linearRampToValueAtTime(.01,now+.3); osc.start(now); osc.stop(now+.3);
    } else {
      osc.type='sawtooth'; osc.frequency.setValueAtTime(120,now); osc.frequency.exponentialRampToValueAtTime(1400,now+.15);
      osc.frequency.setValueAtTime(900,now+.35); gain.gain.setValueAtTime(.8,now);
      gain.gain.linearRampToValueAtTime(.01,now+1.5); osc.start(now); osc.stop(now+1.5);
    }
  } catch (e) { console.log('Audio belum tersedia di browser.'); }
}
function setStatus(text, colorClass='text-yellow-400') {
  const el=document.getElementById('statusText');
  el.innerText=text;
  el.className=`absolute top-4 bg-slate-900/80 px-4 py-1.5 rounded-full text-xs font-medium tracking-wide border border-slate-700 shadow ${colorClass}`;
}
function lockButtons(lock) { document.querySelectorAll('button').forEach(btn => btn.disabled=lock); }
function showMessage(text) {
  const box=document.getElementById('msgBox');
  document.getElementById('msgText').innerText=text;
  box.classList.remove('hidden');
  setTimeout(()=>box.classList.add('hidden'),3000);
}
function wait(ms) { return new Promise(resolve=>setTimeout(resolve,ms)); }

async function doFlip() {
  setStatus('Status: Karakter LEGO sedang salto!','text-blue-400');
  const lego=document.getElementById('legoContainer');
  lego.classList.add('animate-flip'); playSound('flip');
  await wait(1450); lego.classList.remove('animate-flip');
}
async function doEat() {
  setStatus('Status: Menikmati es krim vanila','text-pink-400');
  const img=document.getElementById('legoImg'), ice=document.getElementById('iceCreamProp');
  ice.classList.remove('hidden'); img.classList.add('animate-eat');
  playSound('eat'); await wait(350); playSound('eat'); await wait(850);
  img.classList.remove('animate-eat'); ice.classList.add('hidden');
}
async function doJumpscare() {
  setStatus('Status: KEJUTAN!','text-red-500');
  const overlay=document.getElementById('jumpscareOverlay');
  overlay.classList.remove('hidden');
  // Force layout before starting opacity transition.
  void overlay.offsetWidth;
  overlay.style.transition='opacity 60ms ease-out';
  overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100');
  playSound('jumpscare');
  await wait(1650);
  overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0');
  await wait(250); overlay.classList.add('hidden');
  setStatus('Status: Selesai!','text-emerald-400');
  showMessage('Kejutan selesai!');
}
async function runAction(action) {
  if (isPlaying) return;
  isPlaying=true; lockButtons(true);
  try { await action(); }
  finally { isPlaying=false; lockButtons(false); }
}
function playFlip() { return runAction(doFlip); }
function playEat() { return runAction(doEat); }
function playFullSequence() {
  return runAction(async()=>{
    await doFlip();
    await wait(250);
    await doEat();
    await wait(500);
    await doJumpscare();
  });
}
</script>
